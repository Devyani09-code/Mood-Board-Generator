openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: moodboards
    description: AI moodboard creation and refinement
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /moodboards/generate:
    post:
      operationId: generateMoodboard
      tags: [moodboards]
      summary: Generate a moodboard from a creative brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoodboardGenerateInput"
      responses:
        "200":
          description: Generated moodboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Moodboard"
        "400":
          description: Invalid creative brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /moodboards/refine:
    post:
      operationId: refineMoodboard
      tags: [moodboards]
      summary: Refine a moodboard with a natural-language prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoodboardRefineInput"
      responses:
        "200":
          description: Refined moodboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Moodboard"
        "400":
          description: Invalid refinement request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Refinement failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MoodboardGenerateInput:
      type: object
      properties:
        boardType:
          type: string
          enum: [moodboard, brandboard]
        layoutStyle:
          type: string
        imageCount:
          type: integer
          minimum: 1
          maximum: 12
        purpose:
          type: string
          minLength: 3
        styles:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
      required:
        - boardType
        - layoutStyle
        - imageCount
        - purpose
        - styles
    MoodboardRefineInput:
      type: object
      properties:
        boardType:
          type: string
          enum: [moodboard, brandboard]
        layoutStyle:
          type: string
        imageCount:
          type: integer
          minimum: 1
          maximum: 12
        purpose:
          type: string
          minLength: 3
        styles:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
        prompt:
          type: string
          minLength: 3
        promptHistory:
          type: array
          maxItems: 8
          items:
            type: string
        moodboard:
          $ref: "#/components/schemas/Moodboard"
      required:
        - boardType
        - layoutStyle
        - imageCount
        - purpose
        - styles
        - prompt
        - moodboard
    Moodboard:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        tagline:
          type: string
        palette:
          type: array
          minItems: 3
          maxItems: 6
          items:
            $ref: "#/components/schemas/PaletteColor"
        keywords:
          type: array
          items:
            type: string
        direction:
          type: string
        layout:
          type: array
          items:
            $ref: "#/components/schemas/MoodboardTile"
      required:
        - id
        - title
        - tagline
        - palette
        - keywords
        - direction
        - layout
    PaletteColor:
      type: object
      properties:
        name:
          type: string
        hex:
          type: string
        role:
          type: string
      required:
        - name
        - hex
        - role
    MoodboardTile:
      type: object
      properties:
        type:
          type: string
          enum: [image, text, color, quote]
        label:
          type: string
        value:
          type: string
        accent:
          type: ["string", "null"]
        size:
          type: string
          enum: [small, medium, large]
        imageUrl:
          type: ["string", "null"]
      required:
        - type
        - label
        - value
        - accent
        - size
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

